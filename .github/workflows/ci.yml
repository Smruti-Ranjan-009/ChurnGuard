name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: ruff check app.py src tests

      - name: Run tests
        run: pytest -q

      - name: Verify dataset URL is configured
        env:
          TELCO_DATA_URL: ${{ vars.TELCO_DATA_URL }}
        run: |
          if [ -z "${TELCO_DATA_URL:-}" ]; then
            echo "::error::Repository variable TELCO_DATA_URL is not configured."
            exit 1
          fi

      - name: Download Telco dataset
        env:
          TELCO_DATA_URL: ${{ vars.TELCO_DATA_URL }}
        run: |
          mkdir -p notebook/data
          curl --fail --location --show-error \
            "$TELCO_DATA_URL" \
            --output notebook/data/WA_Fn-UseC_-Telco-Customer-Churn.csv

      - name: Validate Telco dataset
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          dataset_path = Path("notebook/data/WA_Fn-UseC_-Telco-Customer-Churn.csv")
          if not dataset_path.is_file():
              raise SystemExit("Dataset validation failed: downloaded CSV does not exist.")
          if dataset_path.stat().st_size == 0:
              raise SystemExit("Dataset validation failed: downloaded CSV is empty.")

          try:
              dataframe = pd.read_csv(dataset_path)
          except Exception as error:
              raise SystemExit(f"Dataset validation failed: pandas could not read the CSV: {error}")

          if len(dataframe) == 0:
              raise SystemExit("Dataset validation failed: CSV contains no data rows.")
          required_columns = {"Churn", "customerID", "TotalCharges"}
          missing_columns = sorted(required_columns - set(dataframe.columns))
          if missing_columns:
              raise SystemExit(
                  f"Dataset validation failed: missing required columns {missing_columns}."
              )

          print(f"Validated Telco dataset: {len(dataframe)} rows and {len(dataframe.columns)} columns.")
          PY

      - name: Generate model artifacts
        run: python -m src.pipeline.train_pipeline

      - name: Verify model artifacts
        run: |
          test -s artifacts/model.pkl
          test -s artifacts/preprocessor.pkl

      - name: Build Docker image
        run: docker build --tag churndeploy:ci .

      - name: Start container and verify health
        run: |
          docker run --detach --name churndeploy-ci --publish 127.0.0.1:5000:5000 churndeploy:ci
          for attempt in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' churndeploy-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs churndeploy-ci
              exit 1
            fi
            sleep 3
          done
          docker logs churndeploy-ci
          exit 1

      - name: Verify health response
        run: |
          response=$(curl --fail --silent --show-error http://127.0.0.1:5000/health)
          test "$response" = '{"status":"healthy"}'

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force churndeploy-ci || true